<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>苍痕之森 · 2D 狩猎地图原型</title>
  <style>
    :root {
      --ink: #e8ead7;
      --muted: #aeb6a2;
      --gold: #d9b86c;
      --line: rgba(222, 227, 202, .18);
      --glass: rgba(13, 20, 17, .72);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1210; }
    body { color: var(--ink); font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    canvas.dragging { cursor: grabbing; }
    .grain {
      position: fixed; inset: 0; pointer-events: none; opacity: .11; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    }
    header { position: fixed; top: 25px; left: 32px; display: flex; align-items: center; gap: 15px; pointer-events: none; }
    .crest {
      width: 46px; height: 46px; border: 1px solid rgba(217,184,108,.75); transform: rotate(45deg);
      display: grid; place-items: center; background: rgba(12,20,17,.66); box-shadow: 0 0 28px rgba(0,0,0,.28);
    }
    .crest::after { content: "✦"; color: var(--gold); font-size: 19px; transform: rotate(-45deg); }
    .eyebrow { color: var(--gold); font: 600 10px/1.1 system-ui; letter-spacing: .36em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font: 500 clamp(18px,2.2vw,28px)/1.1 Georgia,"Noto Serif SC",serif; letter-spacing: .16em; text-shadow: 0 2px 12px #000; }
    .chapter { position: fixed; right: 32px; top: 29px; text-align: right; pointer-events: none; }
    .chapter b { display: block; font: 500 11px/1.2 system-ui; letter-spacing: .28em; color: var(--gold); }
    .chapter span { font-size: 11px; color: var(--muted); letter-spacing: .12em; }
    .hunter-status { position: fixed; top: 98px; left: 32px; width: min(330px, calc(100vw - 64px)); pointer-events: none; filter: drop-shadow(0 5px 15px rgba(0,0,0,.34)); }
    .status-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:10px; letter-spacing:.16em; color:var(--muted); }
    .status-meta strong { color:var(--ink); font:500 12px/1 Georgia,"Noto Serif SC",serif; letter-spacing:.14em; }
    #hunterState { color:var(--gold); }
    .vital { display:grid; grid-template-columns:34px 1fr 28px; align-items:center; gap:8px; margin:6px 0; }
    .vital label { font-size:9px; letter-spacing:.15em; text-shadow:0 1px 4px #000; }
    .vital output { font:500 9px/1 system-ui; color:rgba(232,234,215,.7); text-align:right; }
    .vital-track { height:8px; padding:1px; background:rgba(5,10,8,.7); border:1px solid rgba(232,234,215,.18); transform:skewX(-14deg); overflow:hidden; }
    .vital-track i { display:block; width:100%; height:100%; transform-origin:left center; transition:transform .09s linear; }
    #lifeBar { background:linear-gradient(90deg,#6f2726,#c15946 70%,#dc8460); box-shadow:0 0 8px rgba(202,78,62,.28); }
    #staminaBar { background:linear-gradient(90deg,#637445,#b0ae52 72%,#e0c870); box-shadow:0 0 8px rgba(214,193,91,.25); }
    .hunter-status.exhausted #staminaBar { animation:staminaWarn .45s steps(2,end) infinite; }
    .spirit-head { display:flex; justify-content:space-between; align-items:center; margin-top:10px; color:var(--muted); font-size:8px; letter-spacing:.14em; }
    #damageMod { color:#d9c897; font:600 9px/1 system-ui; }
    .spirit-shell { position:relative; height:12px; margin-top:5px; padding:2px 16px 2px 2px; background:rgba(5,10,8,.76); border:1px solid rgba(220,225,205,.28); clip-path:polygon(0 0,96% 0,100% 50%,96% 100%,0 100%); transition:border-color .2s,filter .2s; }
    .spirit-shell::after { content:""; position:absolute; right:7px; top:3px; width:5px; height:5px; border:1px solid currentColor; transform:rotate(45deg); }
    .spirit-shell i { display:block; width:100%; height:100%; transform:scaleX(0); transform-origin:left; background:linear-gradient(90deg,#58645c,#d6ddd0); transition:transform .08s linear; }
    .spirit-shell.level-0 { color:#8d9990; }
    .spirit-shell.level-1 { color:#f1f0dc; border-color:rgba(241,240,220,.75); filter:drop-shadow(0 0 5px rgba(241,240,220,.25)); }
    .spirit-shell.level-2 { color:#e2bd56; border-color:rgba(226,189,86,.85); filter:drop-shadow(0 0 5px rgba(226,189,86,.32)); }
    .spirit-shell.level-3 { color:#e8664e; border-color:rgba(232,102,78,.9); filter:drop-shadow(0 0 7px rgba(232,80,61,.4)); }
    .spirit-shell.level-1 i { background:linear-gradient(90deg,#8e9d91,#f4f2df); }
    .spirit-shell.level-2 i { background:linear-gradient(90deg,#816f38,#ecc85f); }
    .spirit-shell.level-3 i { background:linear-gradient(90deg,#842f29,#ef7457); }
    @keyframes staminaWarn { 50% { opacity:.3; } }
    .hud {
      position: fixed; bottom: 27px; left: 32px; right: 32px; display: grid;
      grid-template-columns: minmax(220px, 360px) 1fr auto; gap: 24px; align-items: end;
    }
    .panel { background: linear-gradient(90deg, rgba(12,19,16,.78), rgba(12,19,16,.4)); border-left: 2px solid var(--gold); padding: 12px 15px; backdrop-filter: blur(6px); }
    .zone-title { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
    .zone-title strong { font: 500 14px/1.2 Georgia,"Noto Serif SC",serif; letter-spacing: .12em; }
    .zone-title small { color: var(--gold); font-size: 9px; letter-spacing: .2em; }
    .zone-desc { margin-top: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .map-wrap { min-width: 0; padding-bottom: 3px; }
    .map-labels { display: flex; justify-content: space-between; color: rgba(232,234,215,.56); font-size: 8px; letter-spacing: .12em; margin-bottom: 8px; }
    .mini { height: 6px; background: rgba(232,234,215,.12); position: relative; box-shadow: inset 0 0 0 1px rgba(232,234,215,.08); }
    .mini::before { content:""; position:absolute; inset:2px; background:linear-gradient(90deg,#597a58 0 28%,#a17f4e 28% 49%,#6e7f5d 49% 72%,#765a42 72%); opacity:.8; }
    #mapCursor { position:absolute; top:-5px; width:2px; height:16px; background:#f0d081; box-shadow:0 0 10px #f0d081; transition:left .08s linear; }
    #mapCursor::before { content:""; position:absolute; width:7px; height:7px; border:1px solid #f0d081; transform:rotate(45deg); left:-3px; top:-4px; background:#263326; }
    .controls { color: var(--muted); font-size: 10px; line-height: 1.65; text-align: right; white-space: nowrap; }
    .key { color: var(--ink); border: 1px solid rgba(232,234,215,.28); background: rgba(10,16,14,.48); padding: 2px 6px; margin: 0 2px; border-radius: 2px; }
    .vignette { position: fixed; inset: 0; pointer-events:none; box-shadow: inset 0 0 130px rgba(2,7,5,.66), inset 0 -100px 120px rgba(2,6,4,.42); }
    #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); color: rgba(245,238,211,.8); font: 500 11px/1.5 system-ui; letter-spacing:.22em; text-shadow: 0 2px 10px #000; opacity: 0; transition: opacity .6s; pointer-events:none; }
    #hint.show { opacity: 1; }
    #assetStatus { position:fixed; left:50%; top:22px; transform:translateX(-50%); padding:7px 13px; color:rgba(239,226,187,.82); background:rgba(8,15,12,.68); border:1px solid rgba(217,184,108,.22); font:500 9px/1 system-ui; letter-spacing:.18em; pointer-events:none; opacity:1; transition:opacity .8s; backdrop-filter:blur(5px); }
    #assetStatus.ready { opacity:0; }
    .monster-status { position:fixed; top:92px; right:32px; width:min(360px,calc(100vw - 64px)); padding:11px 14px 12px; pointer-events:none; opacity:0; transform:translateY(-8px); transition:opacity .2s,transform .2s; background:linear-gradient(90deg,rgba(29,12,10,.82),rgba(8,14,12,.62)); border-right:2px solid #c46b4f; filter:drop-shadow(0 5px 16px rgba(0,0,0,.4)); }
    .monster-status.active { opacity:1; transform:none; }
    .monster-meta { display:flex; justify-content:space-between; gap:16px; color:#c9b9a7; font-size:9px; letter-spacing:.16em; }
    .monster-meta strong { color:#f0dfcc; font:500 14px/1 Georgia,"Noto Serif SC",serif; }
    .monster-track { height:7px; margin-top:8px; padding:1px; background:rgba(4,7,6,.82); border:1px solid rgba(234,196,163,.2); transform:skewX(-12deg); overflow:hidden; }
    #monsterLifeBar { display:block; height:100%; width:100%; transform-origin:left; background:linear-gradient(90deg,#6f211e,#c5533b 72%,#e59363); box-shadow:0 0 8px rgba(227,82,55,.3); }
    .monster-note { margin-top:6px; color:rgba(224,211,193,.68); font-size:9px; letter-spacing:.09em; }
    @media (max-width: 760px) {
      header { left: 18px; top: 18px; } .chapter { display:none; }
      .hunter-status { left:18px; top:82px; width:260px; }
      .hud { left:18px; right:18px; bottom:18px; grid-template-columns:1fr; gap:10px; }
      .map-wrap { order:-1; } .controls { display:none; } .panel { padding:9px 12px; }
      .map-labels span:nth-child(even) { display:none; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="苍痕之森横向卷轴地图"></canvas>
  <div class="grain"></div><div class="vignette"></div>

  <header>
    <div class="crest"></div>
    <div><div class="eyebrow">Hunting Ground / 01</div><h1>苍痕之森</h1></div>
  </header>
  <div class="chapter"><b>大型怪物生态 · 第一阶段</b><span>四区域领地战</span></div>

  <section class="hunter-status" aria-label="猎人状态">
    <div class="status-meta"><strong>无名猎人</strong><span id="hunterState">待机</span></div>
    <div class="vital"><label>生命</label><div class="vital-track"><i id="lifeBar"></i></div><output id="lifeValue">100</output></div>
    <div class="vital"><label>体力</label><div class="vital-track"><i id="staminaBar"></i></div><output id="staminaValue">100</output></div>
    <div class="spirit-head"><span>气刃槽 · <b id="bladeLevel">无色</b></span><output id="damageMod">伤害 ×1.00</output></div>
    <div class="spirit-shell level-0" id="spiritShell"><i id="spiritBar"></i></div>
  </section>
  <section class="monster-status" id="monsterStatus" aria-label="大型怪物状态">
    <div class="monster-meta"><strong id="monsterName">大型怪物</strong><span id="monsterState">未发现</span></div>
    <div class="monster-track"><i id="monsterLifeBar"></i></div>
    <div class="monster-note" id="monsterNote">进入领地后将激怒大型怪物</div>
  </section>

  <div class="hud">
    <div class="panel">
      <div class="zone-title"><strong id="zoneName">风痕营地</strong><small id="zoneNo">AREA 01</small></div>
      <div class="zone-desc" id="zoneDesc">古树根系环抱的安全前哨，猎人的远征由此开始。</div>
    </div>
    <div class="map-wrap">
      <div class="map-labels"><span>营地</span><span>苔径</span><span>断瀑</span><span>遗迹</span><span>巢穴</span></div>
      <div class="mini"><i id="mapCursor"></i></div>
    </div>
    <div class="controls"><span class="key">J</span> 踏步斩　<span class="key">K</span> 突刺　<span class="key">L</span> 气刃斩<br><span class="key">Ctrl</span> 特殊纳刀　<span class="key">A/D ×2</span> 翻滚　<span class="key">R</span> 重置</div>
  </div>
  <div id="hint">前方区域 · 雾瀑苔径</div>
  <div id="assetStatus">融合苍痕世界 · 0 / 24</div>

  <script>
  (() => {
    'use strict';
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const ui = {
      cursor: document.querySelector('#mapCursor'), name: document.querySelector('#zoneName'),
      no: document.querySelector('#zoneNo'), desc: document.querySelector('#zoneDesc'),
      hint: document.querySelector('#hint'), state: document.querySelector('#hunterState'),
      lifeBar: document.querySelector('#lifeBar'), staminaBar: document.querySelector('#staminaBar'),
      lifeValue: document.querySelector('#lifeValue'), staminaValue: document.querySelector('#staminaValue'),
      status: document.querySelector('.hunter-status'), spiritBar: document.querySelector('#spiritBar'),
      spiritShell: document.querySelector('#spiritShell'), bladeLevel: document.querySelector('#bladeLevel'),
      damageMod: document.querySelector('#damageMod'), assetStatus: document.querySelector('#assetStatus'),
      monsterStatus:document.querySelector('#monsterStatus'),monsterName:document.querySelector('#monsterName'),
      monsterState:document.querySelector('#monsterState'),monsterLifeBar:document.querySelector('#monsterLifeBar'),monsterNote:document.querySelector('#monsterNote')
    };

    const WORLD_W = 7600;
    const BASE_H = 900;
    const zones = [
      { x:0,    end:1350, name:'风痕营地', no:'AREA 01', desc:'古树根系环抱的安全前哨，猎人的远征由此开始。' },
      { x:1350, end:2850, name:'雾瀑苔径', no:'AREA 02', desc:'苔木与水雾掩护着野猪王，它会用连续冲撞封锁林径。' },
      { x:2850, end:4300, name:'琥珀河谷', no:'AREA 03', desc:'人鱼兽盘踞浅河，巨尾与利爪能同时控制前后方。' },
      { x:4300, end:5850, name:'沉日泥泽', no:'AREA 04', desc:'泥龙以遗迹湿土为巢，喷吐的泥潭会持续抽空体力。' },
      { x:5850, end:7600, name:'灼刃巢穴', no:'AREA 05', desc:'斩龙在焦岩间研磨铁尾，聚合斩必须以翻滚无敌规避。' }
    ];

    // 只作为不可见地表高度场使用；画面中不显示碰撞线或透明台阶。
    const groundPoints = [
      [0,670],[400,668],[760,635],[1120,650],[1420,610],[1740,660],[2040,645],[2380,690],
      [2700,675],[3020,720],[3450,730],[3820,690],[4210,660],[4500,700],[4850,675],[5250,625],
      [5580,665],[5950,700],[6300,655],[6680,700],[7100,665],[7600,650]
    ];
    let W = 0, H = 0, DPR = 1, cam = 0, targetCam = 0, lastTime = 0;
    let dragging = false, dragStartX = 0, dragStartCam = 0, hudVisible = true, lastZone = 0;
    const keys = new Set();
    const hunter = {
      x: 440, vx: 0, facing: 1, state: 'idle', anim: 0,
      health: 100, maxHealth: 100, stamina: 100, maxStamina: 100, exhausted: false, invulnerable: false,
      hitStun:0, knockV:0, defeated:false, noDamageTime:0
    };
    const combat = {
      spirit: 0, maxSpirit: 100, bladeLevel: 0, action: null, sheath: false,
      sheathWindow: 0, sheathTimer: 0, chain: null, chainWindow: 0, bladeTimer: 0, hitStop: 0
    };
    const bladeNames=['无色','白刃','黄刃','红刃'];
    const bladeMultipliers=[1,1.10,1.15,1.20];
    const dummy={x:890,maxHealth:600,health:600,flash:0,shake:0};
    const MONSTER_DEFS={
      boar:{name:'野猪王',asset:'monsterBoar',home:2050,maxHealth:900,height:325,hitY:125,note:'低伤害连续压制 · 冲撞、撕咬、后踢均可击倒',attacks:{
        charge:{name:'林王冲撞',duration:1.16,frames:[12,15],windup:.28,hitAt:.64,range:152,damage:20,knockdown:true,travel:385,omni:true},
        bite:{name:'獠牙撕咬',duration:.88,frames:[16,19],windup:.34,hitAt:.48,range:145,damage:16,knockdown:true},
        kick:{name:'反身后踢',duration:.92,frames:[20,23],windup:.36,hitAt:.53,range:150,damage:18,knockdown:true,behind:true}}},
      mermaid:{name:'人鱼兽',asset:'monsterMermaid',home:3570,maxHealth:1200,height:330,hitY:135,note:'水栖巨兽 · 尾拍覆盖身后，碰撞可长距离追击',attacks:{
        collision:{name:'鳞潮碰撞',duration:1.05,frames:[12,15],windup:.24,hitAt:.58,range:168,damage:34,knockdown:true,travel:300,omni:true},
        claw:{name:'裂鳞爪击',duration:.86,frames:[16,19],windup:.3,hitAt:.47,range:165,damage:30,knockdown:true},
        tail:{name:'潮尾拍击',duration:1.08,frames:[20,23],windup:.43,hitAt:.62,range:218,damage:40,knockdown:true,omni:true}}},
      mud:{name:'泥龙',asset:'monsterMud',home:5070,maxHealth:1500,height:305,hitY:105,note:'泥沼主宰 · 泥潭持续吸收体力并阻碍移动',attacks:{
        bite:{name:'泥牙撕咬',duration:.88,frames:[12,15],windup:.3,hitAt:.49,range:160,damage:36,knockdown:true},
        tail:{name:'沉泥尾拍',duration:1.12,frames:[16,19],windup:.42,hitAt:.64,range:230,damage:44,knockdown:true,omni:true},
        mud:{name:'泥潭喷吐',duration:1.45,frames:[20,23],windup:.58,hitAt:.76,range:620,damage:10,mud:true}}},
      blade:{name:'斩龙',asset:'monsterBlade',home:6870,maxHealth:2400,height:395,hitY:175,note:'最终首领 · 咬尾研磨后的聚合斩必须以翻滚无敌帧规避',attacks:{
        bite:{name:'熔牙撕咬',duration:.9,frames:[12,13],windup:.3,hitAt:.5,range:175,damage:58,knockdown:true},
        claw:{name:'铁爪横裂',duration:.92,frames:[14,15],windup:.32,hitAt:.52,range:190,damage:64,knockdown:true},
        sharpen:{name:'刚刃研磨 · 聚合斩',duration:2.48,frames:[16,23],windup:1.48,hitAt:1.88,range:720,damage:999,knockdown:true,lethal:true,inescapable:true,omni:true,travel:620,travelStart:1.52,travelEnd:2.04}}}
    };
    const monsters=Object.entries(MONSTER_DEFS).map(([id,def])=>({id,def,x:def.home,health:def.maxHealth,facing:-1,state:'idle',attack:null,t:0,cooldown:1.2+hash(def.home)*1.4,flash:0,shake:0,hitDone:false,dead:false}));
    const mudPools=[];
    if(globalThis.__CODEX_TEST__)globalThis.__huntingDebug={hunter,monsters,mudPools};
    const damageNumbers=[];
    const hitSparks=[];
    const impactRings=[];
    const impactBursts=[];
    const lastDirectionTap={left:-Infinity,right:-Infinity};
    const dust = Array.from({length:92}, (_,i) => ({
      x: hash(i*7.1)*WORLD_W, y: 150+hash(i*9.7)*470, r:.45+hash(i*4.3)*1.15,
      a:.035+hash(i*3.4)*.085, s:.055+hash(i*2.1)*.16
    }));

    const ART_SOURCES={
      far:'assets/forest-far-panorama.png', mid:'assets/forest-mid-panorama.png',
      west:'assets/zone-west-camp-waterfall.png', central:'assets/zone-central-river-ruins.png',
      east:'assets/zone-east-nest.png', vegetation:'assets/forest-vegetation-atlas.png',
      wildlife:'assets/forest-wildlife-atlas.png', world:'assets/world-environment-v2.webp',
      hunterMotion:'assets/hunter-motion-v2.png', hunterActions:'assets/hunter-actions-v2.png',
      hunterLocomotion:'assets/hunter-locomotion-v2.png', hunterWalk8:'assets/hunter-walk8-v3.png',
      hunterRun8:'assets/hunter-run8-v3.png', hunterBasic8:'assets/hunter-basic-combo8-v3.png',
      hunterSpirit8:'assets/hunter-spirit-combo8-v3.png', hunterRoll8:'assets/hunter-roll8-v3.png',
      monsterBoar:'assets/monster-boar-king-v1.png',monsterMermaid:'assets/monster-mermaid-beast-v2.png',
      monsterMud:'assets/monster-mud-dragon-v2.png',monsterBlade:'assets/monster-blade-dragon-v2.png',
      monsterBoar16:'assets/monster-boar-king-extra16-v2.png',monsterMermaid16:'assets/monster-mermaid-beast-extra16-v2.png',
      monsterMud16:'assets/monster-mud-dragon-extra16-v2.png',monsterBlade16:'assets/monster-blade-dragon-extra16-v4.png'
    };
    const art={},artTotal=Object.keys(ART_SOURCES).length;let loadedArt=0;
    Object.entries(ART_SOURCES).forEach(([key,src])=>{
      if(typeof Image!=='function'){art[key]=null;return;}
      const image=new Image();art[key]=image;image.decoding='async';
      image.addEventListener('load',()=>{loadedArt++;if(ui.assetStatus){ui.assetStatus.textContent=`融合苍痕世界 · ${loadedArt} / ${artTotal}`;if(loadedArt===artTotal)setTimeout(()=>ui.assetStatus.classList.add('ready'),500);}});
      image.addEventListener('error',()=>{if(ui.assetStatus)ui.assetStatus.textContent='部分场景素材未能载入 · 已启用绘制备份';});
      image.src=src;
    });

    function imageReady(image){return !!(image&&image.complete&&image.naturalWidth>0);}

    function hash(n) { const v = Math.sin(n*127.1+311.7)*43758.5453; return v-Math.floor(v); }
    function lerp(a,b,t){ return a+(b-a)*t; }
    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
    function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}
    function easeOut(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3);}
    function resize(){
      DPR = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
      ctx.setTransform(DPR,0,0,DPR,0,0);
    }
    addEventListener('resize', resize); resize();

    function groundY(x){
      x = clamp(x,0,WORLD_W);
      for(let i=0;i<groundPoints.length-1;i++){
        const a=groundPoints[i], b=groundPoints[i+1];
        if(x>=a[0]&&x<=b[0]) return lerp(a[1],b[1],(x-a[0])/(b[0]-a[0]));

      return 670;

      ctx.closePath(); ctx.fillStyle=fill; ctx.fill();

      ctx.drawImage(image,x-(dw-w)*clamp(progress,0,1),y-(dh-h)*.5,dw,dh);

      combat.action={id:'normalSheath',t:0,processed:new Set(),queued:null,hitAny:false,startX:hunter.x};
      combat.sheath=false;combat.sheathTimer=0;combat.chain=sourceDef.next||null;
      combat.chainWindow=sourceDef.next ? ACTIONS.normalSheath.duration : 0;
      combat.sheathWindow=ACTIONS.normalSheath.duration;hunter.vx=0;
    }

    function startRoll(direction){
      if(hunter.stamina<25){showHint('体力不足 · 无法翻滚');return false;}
      hunter.stamina=Math.max(0,hunter.stamina-25);
      hunter.facing=direction;hunter.vx=0;combat.sheath=false;combat.sheathTimer=0;
      startAction('roll');showHint('翻滚 · 体力 -25 · 中段无敌');return true;
    }

    function requestRoll(direction){
      const action=combat.action;
      if(hunter.stamina<25){showHint('体力不足 · 无法翻滚');return;}
      if(!action){startRoll(direction);return;}
      if(action.id==='roll')return;
      if(['normalSheath','roundSheath','sheathEnter'].includes(action.id)){startRoll(direction);return;}
      // 覆盖已经预输入的派生；当前攻击结束后优先执行翻滚。
      action.queued='roll';action.rollDir=direction;
      showHint('已预输入翻滚 · 取消后续派生');
    }

    function beginSpecialSheath(){
      startAction('sheathEnter');
    }

    function finishSpecialSheath(){
      combat.action=null;combat.sheath=true;combat.sheathTimer=3;combat.chain=null;combat.chainWindow=0;combat.sheathWindow=0;hunter.vx=0;
      showHint('特殊纳刀 · A/D 转向 · J 小居合 / K 大居合');
    }

    function changeBladeLevel(hit){
      if(hit){combat.bladeLevel=Math.min(3,combat.bladeLevel+1);combat.spirit=0;combat.bladeTimer=10;showHint(`${bladeNames[combat.bladeLevel]} · 升刃`);}
      else {combat.bladeLevel=Math.max(0,combat.bladeLevel-1);combat.bladeTimer=combat.bladeLevel>0?10:0;showHint(`${bladeNames[combat.bladeLevel]} · 攻击落空`);}
    }

    function spawnHitEffect(x,y,damage,color,heavy=false){
      damageNumbers.push({x:x+(hash(performance.now())-.5)*20,y:y-42,value:damage,life:.8});
      for(let i=0;i<(heavy?13:7);i++)hitSparks.push({x,y,vx:(hash(i+performance.now()*.001)-.5)*(heavy?260:170),vy:-18-hash(i+31)*150,life:.18+hash(i+9)*.24,size:.8+hash(i+72)*(heavy?2.7:1.8),color});
      impactRings.push({x,y,life:heavy?.48:.36,maxLife:heavy?.48:.36,color});
      impactBursts.push({x,y,life:heavy?.58:.46,maxLife:heavy?.58:.46,color,angle:(hash(performance.now()*.13)-.5)*.7});
    }

    function strikeDummy(event,action){
      const relative=(dummy.x-hunter.x)*hunter.facing;
      const dummyHit=event.omni?Math.abs(dummy.x-hunter.x)<=event.range:(relative>=-24&&relative<=event.range);
      const fullBonus=combat.spirit>=combat.maxSpirit?1.05:1;
      const multiplier=bladeMultipliers[combat.bladeLevel]*fullBonus;
      const damage=Math.round(event.damage*multiplier);
      const effectColor=['#dce4de','#f5f3de','#edc75c','#ef7058'][combat.bladeLevel];
      let hit=dummyHit;
      if(dummyHit){
        dummy.health-=damage;dummy.flash=.13;dummy.shake=.18;action.hitAny=true;
        combat.hitStop=Math.max(combat.hitStop,event.level ? .07 : .045);
        if(dummy.health<=0)dummy.health=dummy.maxHealth;
        spawnHitEffect(dummy.x,groundY(dummy.x)-60,damage,effectColor,event.level);
      }
      const monster=monsters.find(m=>!m.dead&&Math.abs(m.x-hunter.x)<=event.range+30&&
        (event.omni||((m.x-hunter.x)*hunter.facing>=-28&&(m.x-hunter.x)*hunter.facing<=event.range)));
      if(monster){
        monster.health=Math.max(0,monster.health-damage);monster.flash=.16;monster.shake=.2;action.hitAny=true;hit=true;
        combat.hitStop=Math.max(combat.hitStop,event.level?.085:.055);
        spawnHitEffect(monster.x,groundY(monster.x)-monster.def.hitY,damage,effectColor,true);
        if(monster.health<=0){monster.dead=true;monster.state='dead';monster.attack=null;showHint(`${monster.def.name} · 狩猎完成`);}
      }
      if(hit&&event.gain)combat.spirit=Math.min(combat.maxSpirit,combat.spirit+event.gain);
      if(event.level)changeBladeLevel(hit);
      return hit;
    }

    function damageHunter(monster,attack){
      if(hunter.invulnerable){
        showHint('翻滚无敌 · 攻击规避');
        impactRings.push({x:hunter.x,y:groundY(hunter.x)-58,life:.3,maxLife:.3,color:'#d7e8dc'});
        return false;
      }
      hunter.health=attack.lethal?0:Math.max(0,hunter.health-attack.damage);hunter.noDamageTime=0;
      hunter.hitStun=attack.knockdown?.82:.36;hunter.knockV=monster.facing*(attack.knockdown?210:110);
      combat.action=null;combat.sheath=false;combat.sheathTimer=0;combat.chain=null;combat.chainWindow=0;combat.sheathWindow=0;
      spawnHitEffect(hunter.x,groundY(hunter.x)-70,attack.lethal?'一击必杀':attack.damage,'#e77c5e',true);
      if(hunter.health<=0){hunter.defeated=true;hunter.hitStun=1.3;showHint('力尽倒下 · 按 R 重新狩猎');}
      else showHint(`${monster.def.name} · ${attack.name} · 击倒`);
      return true;
    }

    function monsterAttackHits(monster,attack){
      if(attack.mud){
        const zone=zones.find(z=>monster.x>=z.x&&monster.x<z.end),target=clamp(hunter.x+hunter.vx*.25,zone.x+120,zone.end-120);
        mudPools.push({x:target,radius:145,life:8,maxLife:8});showHint('泥潭生成 · 持续削减体力');return;
      }
      const relative=(hunter.x-monster.x)*monster.facing;
      const hit=attack.inescapable?true:attack.behind?(relative<=35&&relative>=-attack.range):attack.omni?Math.abs(hunter.x-monster.x)<=attack.range:(relative>=-82&&relative<=attack.range);
      if(hit)damageHunter(monster,attack);
      else if(attack.lethal)showHint('聚合斩落空 · 成功规避');
    }

    function beginMonsterAttack(monster,id){
      const attack=monster.def.attacks[id];monster.attack={id,def:attack};monster.state='attack';monster.t=0;monster.hitDone=false;
      monster.facing=hunter.x>=monster.x?1:-1;
      if(attack.lethal)showHint('危险 · 斩龙正在咬尾研磨 · 准备翻滚');
    }

    function chooseMonsterAttack(monster,distance){
      const ids=Object.keys(monster.def.attacks);
      if(monster.id==='boar'&&distance>210)return 'charge';
      if(monster.id==='mermaid'&&distance>230)return 'collision';
      if(monster.id==='mud'&&distance>240)return 'mud';
      if(monster.id==='blade'&&hash(performance.now()*.002+monster.x)>.58)return 'sharpen';
      return ids[Math.floor(hash(performance.now()*.003+monster.x)*ids.length)];
    }

    function updateMonsters(dt){
      mudPools.forEach(pool=>pool.life-=dt);
      for(let i=mudPools.length-1;i>=0;i--)if(mudPools[i].life<=0)mudPools.splice(i,1);
      monsters.forEach(monster=>{
        monster.flash=Math.max(0,monster.flash-dt);monster.shake=Math.max(0,monster.shake-dt);
        if(monster.dead)return;
        if(hunter.defeated){monster.attack=null;monster.state='idle';monster.t=0;return;}
        const distance=Math.abs(hunter.x-monster.x),active=distance<760&&!hunter.defeated;
        if(!active&&monster.state!=='attack'){monster.state='idle';monster.cooldown=Math.max(.35,monster.cooldown-dt*.25);return;}
        if(monster.attack){
          const attack=monster.attack.def,previous=monster.t;monster.t+=dt;
          const travelStart=attack.travelStart??attack.windup*.62,travelEnd=attack.travelEnd??attack.hitAt;
          if(attack.travel&&monster.t>=travelStart&&previous<=travelEnd){
            const step=Math.max(0,Math.min(monster.t,travelEnd)-Math.max(previous,travelStart));
            monster.x=clamp(monster.x+monster.facing*attack.travel/(travelEnd-travelStart)*step,monster.def.home-650,monster.def.home+650);
          }
          if(!monster.hitDone&&previous<attack.hitAt&&monster.t>=attack.hitAt){monster.hitDone=true;monsterAttackHits(monster,attack);}
          if(monster.t>=attack.duration){monster.attack=null;monster.state='idle';monster.t=0;monster.cooldown=.7+hash(performance.now()*.001+monster.x)*.9;}
          return;
        }
        monster.cooldown-=dt;
        if(monster.cooldown<=0&&distance<(monster.id==='mud'?600:340)){beginMonsterAttack(monster,chooseMonsterAttack(monster,distance));return;}
        if(distance>155){
          monster.state='move';monster.facing=hunter.x>=monster.x?1:-1;
          const speed={boar:92,mermaid:76,mud:62,blade:98}[monster.id];monster.x=clamp(monster.x+monster.facing*speed*dt,monster.def.home-620,monster.def.home+620);monster.t+=dt;
        }else monster.state='idle';
      });
    }

    function updateCombat(dt){
      dummy.flash=Math.max(0,dummy.flash-dt);dummy.shake=Math.max(0,dummy.shake-dt);
      if(combat.bladeLevel>0){
        combat.bladeTimer-=dt;
        if(combat.bladeTimer<=0){
          combat.bladeLevel=Math.max(0,combat.bladeLevel-1);combat.bladeTimer=combat.bladeLevel>0?10:0;
          showHint(`${bladeNames[combat.bladeLevel]} · 刃色衰减`);
        }
      }
      damageNumbers.forEach(n=>{n.life-=dt;n.y-=28*dt;});
      hitSparks.forEach(s=>{s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=360*dt;});
      impactRings.forEach(r=>r.life-=dt);
      impactBursts.forEach(b=>b.life-=dt);
      while(damageNumbers.length&&damageNumbers[0].life<=0)damageNumbers.shift();
      for(let i=hitSparks.length-1;i>=0;i--)if(hitSparks[i].life<=0)hitSparks.splice(i,1);
      for(let i=impactRings.length-1;i>=0;i--)if(impactRings[i].life<=0)impactRings.splice(i,1);
      for(let i=impactBursts.length-1;i>=0;i--)if(impactBursts[i].life<=0)impactBursts.splice(i,1);
      if(combat.hitStop>0){combat.hitStop=Math.max(0,combat.hitStop-dt);return;}
      if(!combat.action){
        hunter.invulnerable=false;
        if(combat.sheath){
          combat.sheathTimer=Math.max(0,combat.sheathTimer-dt);
          if(combat.sheathTimer<=0){combat.sheath=false;showHint('特殊纳刀已解除');}
        }
        combat.sheathWindow=Math.max(0,combat.sheathWindow-dt);combat.chainWindow=Math.max(0,combat.chainWindow-dt);
        if(combat.chainWindow<=0)combat.chain=null;
        return;
      }

      const action=combat.action,def=ACTIONS[action.id],previous=action.t;action.t+=dt;
      hunter.invulnerable=action.id==='roll'&&action.t>=.10&&action.t<=.47;
      const travelSegments=def.travelSegments||(def.travel?[{start:def.travelStart,end:def.travelEnd,distance:def.travel}]:[]);
      travelSegments.forEach(segment=>{
        if(action.t>=segment.start&&previous<=segment.end){
          const activeDt=Math.max(0,Math.min(action.t,segment.end)-Math.max(previous,segment.start));
          hunter.x=clamp(hunter.x+hunter.facing*segment.distance/(segment.end-segment.start)*activeDt,90,WORLD_W-90);
          if(!dragging)targetCam=clamp(hunter.x-W*.38,0,Math.max(0,WORLD_W-W));
        }
      });
      def.hits.forEach((event,index)=>{
        if(!action.processed.has(index)&&previous<event.at&&action.t>=event.at){action.processed.add(index);strikeDummy(event,action);}
      });
      if(action.t>=def.duration){
        const queued=action.queued,rollDir=action.rollDir;combat.action=null;hunter.invulnerable=false;
        if(action.id==='sheathEnter'){finishSpecialSheath();return;}
        if(action.id==='normalSheath'){combat.chain=null;combat.chainWindow=0;combat.sheathWindow=0;return;}
        if(queued==='roll'&&startRoll(rollDir||hunter.facing))return;
        if(queued==='sheath'){beginSpecialSheath();return;}
        if(queued&&startAction(queued))return;
        if(action.id==='roundslash'){startAction('roundSheath');return;}
        if(def.autoSheath){beginNormalSheath(def);return;}
        combat.chain=def.next||null;combat.chainWindow=def.next ? .62 : 0;
        combat.sheathWindow=def.eligible ? .72 : 0;
      }
    }

    function handleCombatInput(key){
      const action=combat.action;
      if(action){
        const def=ACTIONS[action.id];
        if(action.id==='normalSheath'){
          if(key==='control'){beginSpecialSheath();return;}
          if(key==='l'&&['thrust','rising','stepSlash'].includes(combat.chain)){startAction('spirit1');return;}
          if(key==='k'&&combat.chain==='thrust'){startAction('thrust');return;}
          if(key==='j'&&['rising','stepSlash'].includes(combat.chain)){startAction(combat.chain);return;}
          if(key==='l'&&['spirit2','spirit3','roundslash'].includes(combat.chain)){startAction(combat.chain);return;}
          return;
        }
        if(key==='control'&&def.eligible){action.queued='sheath';return;}
        if(key==='l'&&['stepSlash','thrust','rising'].includes(action.id)){action.queued='spirit1';return;}
        if(key==='k'&&action.id==='stepSlash'){action.queued='thrust';return;}
        if(key==='j'&&action.id==='thrust'){action.queued='rising';return;}
        if(key==='j'&&action.id==='rising'){action.queued='stepSlash';return;}
        if(key==='l'&&['spirit1','spirit2','spirit3'].includes(action.id)&&def.next){action.queued=def.next;return;}
        return;
      }
      if(key==='control'){if(combat.sheathWindow>0)beginSpecialSheath();return;}
      if(combat.sheath){
        if(key==='j')startAction('iaiSmall');
        else if(key==='k')startAction('iaiBig');
        return;
      }
      if(key==='j')startAction(combat.chain==='rising'&&combat.chainWindow>0?'rising':'stepSlash');
      else if(key==='k')startAction('thrust');
      else if(key==='l'){
        const spiritChain=['spirit2','spirit3','roundslash'].includes(combat.chain)&&combat.chainWindow>0;
        startAction(spiritChain?combat.chain:'spirit1');
      }
    }

    function updateHunter(dt){
      if(!hunter.defeated){
        hunter.noDamageTime+=dt;
        if(hunter.noDamageTime>=15&&hunter.health<hunter.maxHealth)hunter.health=Math.min(hunter.maxHealth,hunter.health+2.4*dt);
      }
      if(hunter.defeated){hunter.vx=0;hunter.state='down';hunter.invulnerable=false;return;}
      if(hunter.hitStun>0){
        hunter.hitStun=Math.max(0,hunter.hitStun-dt);hunter.x=clamp(hunter.x+hunter.knockV*dt,90,WORLD_W-90);hunter.knockV=lerp(hunter.knockV,0,clamp(dt*7,0,1));hunter.vx=0;hunter.state='down';hunter.anim+=dt*5;return;
      }
      const inMud=mudPools.some(pool=>Math.abs(hunter.x-pool.x)<pool.radius*.82);
      const locked=!!combat.action||combat.sheath;
      const rawDir=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);
      if(combat.sheath&&rawDir)hunter.facing=rawDir;
      const dir=locked?0:rawDir;
      const wantsRun=dir!==0&&keys.has('shift');
      if(hunter.exhausted&&hunter.stamina>=28) hunter.exhausted=false;
      const running=wantsRun&&!hunter.exhausted&&hunter.stamina>0;
      const targetV=dir*(running?335:168)*(inMud?.58:1);
      hunter.vx=lerp(hunter.vx,targetV,clamp(dt*(dir?11:15),0,1));
      if(!dir&&Math.abs(hunter.vx)<1) hunter.vx=0;
      hunter.x=clamp(hunter.x+hunter.vx*dt,90,WORLD_W-90);
      if(dir) hunter.facing=dir;

      if(inMud){
        hunter.stamina=Math.max(0,hunter.stamina-18*dt);if(hunter.stamina<=0)hunter.exhausted=true;
      }else if(running){
        hunter.stamina=Math.max(0,hunter.stamina-22*dt);
        if(hunter.stamina<=0) hunter.exhausted=true;
      } else if(!(combat.action&&combat.action.id==='roll')) {
        hunter.stamina=Math.min(hunter.maxStamina,hunter.stamina+(dir?8:18)*dt);
      }

      hunter.state=combat.action?'attack':combat.sheath?'sheath':dir?(running?'run':'walk'):'idle';
      hunter.anim+=dt*(hunter.state==='run'?13:hunter.state==='walk'?7.5:2.2);
      if(dir&&!dragging) targetCam=clamp(hunter.x-W*.38,0,Math.max(0,WORLD_W-W));
    }

    function drawHunterProcedural(){
      const x=hunter.x-cam, y=groundY(hunter.x);
      if(x<-100||x>W+100)return;
      const phase=hunter.anim;
      const run=hunter.state==='run', walk=hunter.state==='walk';
      const action=combat.action, actionDef=action?ACTIONS[action.id]:null;
      const actionP=action?clamp(action.t/actionDef.duration,0,1):0;
      const rollTuck=action&&action.id==='roll'?Math.sin(smooth((actionP-.06)/.82)*Math.PI):0;
      const hasActionTravel=action&&(actionDef.travel||actionDef.travelSegments);
      let actionGait=phase;
      if(hasActionTravel){
        if(action.id==='iaiSmall')actionGait=action.t<.29?clamp(action.t/.26,0,1)*Math.PI:Math.PI+clamp((action.t-.29)/.13,0,1)*Math.PI;
        else actionGait=clamp(action.t/actionDef.travelEnd,0,1)*Math.PI;
      }
      const step=run?19:walk?11:hasActionTravel?(action.id==='roll'?0:action.id==='roundslash'?14:10):0;
      const legA=Math.sin(actionGait)*step, legB=-legA;
      const liftScale=run?8:walk?4:hasActionTravel&&action.id!=='roll'?4:0;
      const liftA=liftScale*Math.max(0,Math.cos(actionGait));
      const liftB=liftScale*Math.max(0,-Math.cos(actionGait));
      const bob=action||combat.sheath?0:run?Math.abs(Math.sin(phase))*4:walk?Math.abs(Math.sin(phase))*2:Math.sin(phase)*.8;
      let actionLean=0,crouch=combat.sheath?5:0;
      if(action){
        const strikeAt=actionDef.hits.length?actionDef.hits[0].at:actionDef.duration*.72;
        const wind=smooth(action.t/strikeAt),recover=smooth((action.t-strikeAt-.04)/Math.max(.12,actionDef.duration-strikeAt-.04));
        if(action.id==='roll'){
          const prep=smooth(actionP/.16),recover=smooth((actionP-.78)/.22),spin=smooth((actionP-.12)/.64);
          actionLean=0;crouch=10*prep+7*Math.sin(spin*Math.PI)-8*recover;
        }
        else if(action.id==='thrust'){actionLean=-.07*(1-wind)+.17*wind-.15*recover;crouch=6*wind-3*recover;}
        else if(action.id==='rising'){actionLean=.07*(1-wind)-.13*wind+.11*recover;crouch=5*Math.sin(actionP*Math.PI);}
        else if(action.id==='roundslash'){actionLean=-.08*(1-wind)+.14*Math.sin(actionP*Math.PI*2)*(1-recover);crouch=7*Math.sin(actionP*Math.PI);}
        else if(action.id==='iaiBig'){actionLean=-.1*(1-wind)+.2*wind-.18*recover;crouch=8*(1-recover);}
        else if(action.id==='sheathEnter'||action.id==='roundSheath'||action.id==='normalSheath'){
          const align=smooth(actionP/.32),insert=smooth((actionP-.3)/.48),settle=smooth((actionP-.82)/.18);
          actionLean=.075*(1-align)-.065*insert+.05*settle;crouch=3*align+4*insert-5*settle;
        }
        else {actionLean=-.045*(1-wind)+.1*wind-.08*recover;crouch=4*Math.sin(actionP*Math.PI);}
      }
      const lean=(run?.09:0)+actionLean;
      // 正值在面朝右时为顺时针前滚；镜像后自动成为面朝左的逆时针前滚。
      const rollRotation=action&&action.id==='roll'?smooth((actionP-.12)/.64)*Math.PI*2:0;

      // 接地阴影不随朝向翻转。
      ctx.save();ctx.globalAlpha=.34;ctx.fillStyle='#07100c';ctx.beginPath();
      ctx.ellipse(x,y+4,action&&action.id==='roll'?40:run?35:28,7,0,0,Math.PI*2);ctx.fill();ctx.restore();

      if(action&&action.id==='roll'){
        const rp=clamp(action.t/actionDef.duration,0,1),aura=hunter.invulnerable ? .68 : .2;
        ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(224,240,229,${aura})`;ctx.lineWidth=hunter.invulnerable?5:2;
        ctx.beginPath();ctx.ellipse(x,y-39,32+Math.sin(rp*Math.PI)*12,45,0,0,Math.PI*2);ctx.stroke();
        ctx.strokeStyle=`rgba(202,226,213,${aura*.75})`;ctx.lineWidth=2;
        for(let i=0;i<5;i++){const yy=y-18-i*13,len=28+i*10;ctx.beginPath();ctx.moveTo(x-hunter.facing*(18+i*5),yy);ctx.lineTo(x-hunter.facing*(len+55),yy+4);ctx.stroke();}
        for(let i=1;i<=3;i++){ctx.globalAlpha=aura*(.35-i*.07);ctx.beginPath();ctx.arc(x-hunter.facing*i*18,y-39,26+i*4,-1.1,1.1);ctx.stroke();}ctx.restore();
        const dustAlpha=Math.max(clamp(1-rp/.2,0,1),clamp((rp-.76)/.24,0,1));
        if(dustAlpha>0){ctx.save();ctx.fillStyle=`rgba(158,157,123,${dustAlpha*.28})`;for(let i=0;i<7;i++){const dx=(hash(i+23)-.5)*74-hunter.facing*dustAlpha*18,dy=hash(i+61)*12;ctx.beginPath();ctx.ellipse(x+dx,y-dy,6+hash(i+8)*13,2+hash(i+17)*4,0,0,Math.PI*2);ctx.fill();}ctx.restore();}
      }

      ctx.save();ctx.translate(x,y-bob);ctx.scale(hunter.facing,1);ctx.translate(0,crouch);
      if(action&&action.id==='roll'){
        const shoulderLift=Math.sin(smooth((actionP-.08)/.76)*Math.PI)*7;
        ctx.translate(0,-39-shoulderLift);ctx.rotate(rollRotation);ctx.translate(0,39);
      }else ctx.rotate(lean);
      ctx.lineCap='round';ctx.lineJoin='round';

      // 非攻击状态下背负加长太刀，长度明显超过角色身高。
      if((!action||action.id==='roll')&&!combat.sheath){

      if(monster.dead)return 0;
      if(monster.attack){
        const attack=monster.attack.def,p=clamp(monster.t/attack.duration,0,1),first=attack.frames[0],last=attack.frames[1];

        const def=ACTIONS[action.id],p=clamp(action.t/def.duration,0,1);
        if(action.id==='stepSlash')return {layout:'basic8',frame:Math.min(3,Math.floor(p*4))};
        if(action.id==='thrust')return {layout:'basic8',frame:p<.5?4:5};
        if(action.id==='rising')return {layout:'basic8',frame:p<.52?6:7};
        if(action.id==='spirit1')return {layout:'spirit8',frame:p<.52?0:1};
        if(action.id==='spirit2')return {layout:'spirit8',frame:p<.5?2:3};
        if(action.id==='spirit3')return {layout:'spirit8',frame:p<.5?4:5};
        if(action.id==='roundslash')return {layout:'spirit8',frame:p<.52?6:7};
        if(action.id==='normalSheath')return {layout:'motion',frame:p<.42?8:9};
        if(action.id==='sheathEnter')return {layout:'actions',frame:p<.58?4:5};
        if(action.id==='roundSheath')return {layout:'actions',frame:10};
        if(action.id==='iaiSmall')return p<.16?{layout:'actions',frame:5}:p<.5?{layout:'actions',frame:6}:p<.84?{layout:'actions',frame:7}:{layout:'motion',frame:8};
        if(action.id==='iaiBig')return p<.28?{layout:'actions',frame:8}:p<.66?{layout:'actions',frame:9}:{layout:'actions',frame:10};
        if(action.id==='roll')return {layout:'roll8',frame:Math.min(7,Math.floor(p*8))};
      }
      if(hunter.state==='down')return {layout:'roll8',frame:4};
      if(combat.sheath)return {layout:'actions',frame:5};
      if(hunter.state==='run')return {layout:'run8',frame:Math.floor(hunter.anim*.75)%8};
      if(hunter.state==='walk')return {layout:'walk8',frame:Math.floor(hunter.anim*.9)%8};
      return {layout:'motion',frame:0};
    }

    function drawHunterSpriteFrame(layoutName,frame,x,y){
      const layout=hunterAtlasLayouts[layoutName],image=art[layout.image];
      if(!imageReady(image))return false;
      const col=frame%4,row=Math.floor(frame/4),sw=384;
      const sy=Math.round(row*1024/layout.rows),ey=Math.round((row+1)*1024/layout.rows),sh=ey-sy;
      const scale=layout.height/sh,anchor=layout.anchors[frame]??192,bottom=layout.bottoms[frame]??sh;
      ctx.save();ctx.translate(x,y);ctx.rotate(clamp(groundSlope(hunter.x)*.34,-.11,.11));ctx.scale(hunter.facing,1);
      ctx.drawImage(image,col*sw,sy,sw,sh,-anchor*scale,-bottom*scale,sw*scale,sh*scale);
      ctx.restore();return true;
    }

    function drawHunter(){
      const x=hunter.x-cam,y=groundY(hunter.x);
      if(x<-150||x>W+150)return;
      const pose=selectHunterSprite();
      const selectedLayout=hunterAtlasLayouts[pose.layout];
      if(!selectedLayout||!imageReady(art[selectedLayout.image])){
        drawHunterProcedural();return;
      }
      // 阴影严格贴住碰撞地面；角色帧的脚底不透明边界也锚定在同一条 y 线上。
      ctx.save();ctx.globalAlpha=.2;ctx.fillStyle='#07100c';ctx.beginPath();ctx.ellipse(x,y+2,32,6,0,0,Math.PI*2);ctx.fill();ctx.restore();
      drawHunterSpriteFrame(pose.layout,pose.frame,x,y);
      // 只保留命中瞬间的窄刃闪，取消旧版大面积残影和翻滚光圈。
      const action=combat.action,def=action?ACTIONS[action.id]:null;
      if(action&&def&&def.hits.some(hit=>Math.abs(action.t-hit.at)<.045)){
        const forward=['thrust','iaiBig'].includes(action.id),levelColor=['210,221,214','241,239,216','229,190,82','226,92,70'][combat.bladeLevel];
        ctx.save();ctx.translate(x+hunter.facing*42,y-64);ctx.scale(hunter.facing,1);ctx.globalCompositeOperation='screen';
        ctx.strokeStyle=`rgba(${levelColor},.24)`;ctx.lineWidth=2;ctx.beginPath();
        if(forward){ctx.moveTo(6,0);ctx.lineTo(122,-3);}else ctx.arc(0,0,88,-1.2,.34);ctx.stroke();ctx.restore();
      }
    }

    function drawTrainingDummy(){
      const x=dummy.x-cam,y=groundY(dummy.x);
      if(x<-90||x>W+90)return;
      const shake=dummy.shake>0?Math.sin(dummy.shake*150)*5:0;
      ctx.save();ctx.translate(x+shake,y);
      ctx.globalAlpha=.3;ctx.fillStyle='#07100c';ctx.beginPath();ctx.ellipse(0,4,31,7,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='#463525';ctx.fillRect(-6,-104,12,108);
      ctx.strokeStyle='#766047';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-38,-70);ctx.lineTo(38,-70);ctx.stroke();
      ctx.fillStyle=dummy.flash>0?'#dacb9a':'#98825d';ctx.strokeStyle='#473a29';ctx.lineWidth=3;
      ctx.beginPath();ctx.roundRect(-28,-94,56,66,10);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#c0a879';ctx.lineWidth=2;for(let i=-20;i<=20;i+=10){ctx.beginPath();ctx.moveTo(i,-91);ctx.lineTo(i+5,-31);ctx.stroke();}
      ctx.fillStyle='#72352f';ctx.beginPath();ctx.arc(0,-62,14,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#d5b867';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-62,8,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#6d302d';ctx.beginPath();ctx.moveTo(-33,-100);ctx.lineTo(0,-121);ctx.lineTo(33,-100);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(9,15,12,.72)';ctx.fillRect(-35,-137,70,5);
      ctx.fillStyle='#b44f42';ctx.fillRect(-35,-137,70*(dummy.health/dummy.maxHealth),5);
      ctx.fillStyle='rgba(236,231,205,.7)';ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillText('训练木桩',0,-145);
      ctx.restore();
    }

    function drawCombatEffects(){
      hitSparks.forEach(s=>{
        const alpha=clamp(s.life/.45,0,1);ctx.globalAlpha=alpha;ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(s.x-cam,s.y);ctx.lineTo(s.x-cam-s.vx*.045,s.y-s.vy*.045);ctx.stroke();
      });
      impactRings.forEach(r=>{
        const p=1-r.life/r.maxLife,alpha=Math.sin(p*Math.PI);
        ctx.save();ctx.translate(r.x-cam,r.y);ctx.scale(1,.58);ctx.globalAlpha=alpha*.38;ctx.strokeStyle=r.color;ctx.lineWidth=2.5*(1-p)+.8;
        ctx.beginPath();ctx.arc(0,0,12+p*78,0,Math.PI*2);ctx.stroke();
        ctx.globalAlpha=alpha*.18;ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,25+p*82,0,Math.PI*2);ctx.stroke();ctx.restore();
        ctx.save();ctx.translate(r.x-cam,r.y);ctx.globalAlpha=alpha*.35;ctx.strokeStyle='#fff3c6';ctx.lineWidth=1.2;
        for(let i=0;i<4;i++){const a=i*Math.PI/2+p*.35,len=20+(1-p)*32;ctx.beginPath();ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.stroke();}ctx.restore();
      });
      impactBursts.forEach(b=>{
        const p=1-b.life/b.maxLife,alpha=Math.pow(1-p,1.4);
        ctx.save();ctx.translate(b.x-cam,b.y);ctx.rotate(b.angle);ctx.globalCompositeOperation='lighter';
        const glow=ctx.createRadialGradient(0,0,0,0,0,18+p*34);glow.addColorStop(0,`rgba(255,249,216,${alpha*.32})`);glow.addColorStop(.35,`rgba(255,225,157,${alpha*.13})`);glow.addColorStop(1,'rgba(255,220,150,0)');ctx.fillStyle=glow;ctx.fillRect(-58,-58,116,116);
        ctx.globalAlpha=alpha*.46;ctx.strokeStyle=b.color;ctx.lineWidth=4*(1-p)+1;ctx.beginPath();ctx.moveTo(-38-p*10,-21);ctx.quadraticCurveTo(0,3,42+p*12,20);ctx.stroke();
        ctx.strokeStyle='rgba(255,250,225,.72)';ctx.lineWidth=1.25;ctx.beginPath();ctx.moveTo(-40-p*10,-23);ctx.quadraticCurveTo(0,1,44+p*12,18);ctx.stroke();
        ctx.rotate(1.45);ctx.strokeStyle=b.color;ctx.lineWidth=2.4*(1-p)+.7;ctx.globalAlpha=alpha*.28;ctx.beginPath();ctx.moveTo(-27,-15);ctx.quadraticCurveTo(0,2,31,14);ctx.stroke();ctx.restore();
      });
      damageNumbers.forEach(n=>{
        ctx.globalAlpha=clamp(n.life/.35,0,1);ctx.fillStyle='#f3df9c';ctx.strokeStyle='rgba(39,24,18,.8)';
        ctx.lineWidth=3;ctx.font='700 18px Georgia';ctx.textAlign='center';ctx.strokeText(n.value,n.x-cam,n.y);ctx.fillText(n.value,n.x-cam,n.y);
      });
      ctx.globalAlpha=1;
    }

    function drawForeground(){
      if(imageReady(art.vegetation)){
        // 主环境贴图已经包含近景植物，不再额外叠加大尺寸叶片遮挡角色。
        return;
      }
      const p=1.11, spacing=520, viewX=cam*p;
      ctx.fillStyle='#0d1914';
      const treeStart=Math.floor(viewX/spacing)-2, treeEnd=Math.ceil((viewX+W)/spacing)+2;
      for(let n=treeStart;n<=treeEnd;n++){
        const worldX=n*spacing+(hash(n+41)-.5)*150;
        const x=worldX-viewX, side=hash(n)>.5?1:-1;
        const edge=clamp(Math.abs(x-W*.5)/(W*.5),0,1);
        ctx.save();ctx.translate(x,H+20);ctx.rotate((hash(n+3)-.5)*.18);
        ctx.globalAlpha=.3+smooth(edge)*.42;
        ctx.fillRect(-14,-155-hash(n)*80,28,280);
        ctx.beginPath();ctx.ellipse(side*44,-168-hash(n)*72,92,45,.3*side,0,Math.PI*2);ctx.fill();ctx.restore();
      }

      // 近景叶片固定在世界坐标中；镜头移动时只产生稳定视差，不重新随机布局。
      const leafSpacing=235;
      const leafStart=Math.floor(viewX/leafSpacing)-2, leafEnd=Math.ceil((viewX+W)/leafSpacing)+2;
      for(let n=leafStart;n<=leafEnd;n++){
        const worldX=n*leafSpacing+(hash(n+83)-.5)*105;
        const x=worldX-viewX,y=H+12,len=50+hash(n+8)*88;
        const edge=clamp(Math.abs(x-W*.5)/(W*.5),0,1);
        ctx.save();ctx.translate(x,y);ctx.rotate((hash(n+12)-.5)*.72);ctx.fillStyle='rgba(8,22,15,.72)';ctx.globalAlpha=.48+smooth(edge)*.34;
        ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-22,-len*.65,0,-len);ctx.quadraticCurveTo(25,-len*.5,0,0);ctx.fill();ctx.restore();
      }
    }

    function drawAtmosphere(t){
      // 瀑布水雾固定在世界坐标，分成贴水雾、上升雾团和扩散水环三层。
      const fallX=2240-cam,fallY=H*.73;
      if(fallX>-330&&fallX<W+330){
        ctx.save();ctx.globalCompositeOperation='screen';
        for(let i=0;i<9;i++){
          const phase=(t*.000055+i*.137)%1,drift=(hash(i+22)-.5)*120+Math.sin(t*.0005+i)*20;
          const x=fallX+drift+phase*34,y=fallY-phase*H*.22,rx=55+phase*105;
          const g=ctx.createRadialGradient(x,y,0,x,y,rx);
          g.addColorStop(0,`rgba(224,239,232,${(1-phase)*.11})`);g.addColorStop(.48,`rgba(211,231,224,${(1-phase)*.055})`);g.addColorStop(1,'rgba(207,228,221,0)');
          ctx.fillStyle=g;ctx.fillRect(x-rx,y-rx*.52,rx*2,rx*1.04);
        }
        ctx.globalCompositeOperation='source-over';ctx.strokeStyle='rgba(235,242,225,.22)';ctx.lineWidth=1.2;
        for(let i=0;i<4;i++){const phase=(t*.00018+i*.25)%1,r=38+phase*145;ctx.globalAlpha=1-phase;ctx.beginPath();ctx.ellipse(fallX,fallY+9,r,r*.12,0,0,Math.PI*2);ctx.stroke();}
        ctx.restore();
      }
      // 缓慢移动的地雾
      for(let i=0;i<8;i++){
        const x=((i*337-cam*.23+t*.008*(.4+hash(i)))%(W+500))-250;
        const y=H*(.58+hash(i+11)*.22),rx=180+hash(i)*260;
        const g=ctx.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,'rgba(203,218,198,.065)');g.addColorStop(1,'rgba(203,218,198,0)');
        ctx.fillStyle=g;ctx.fillRect(x-rx,y-rx*.35,rx*2,rx*.7);
      }
      dust.forEach((d,i)=>{
        const worldX=(d.x+t*d.s*.025)%(WORLD_W+300)-150,x=worldX-cam*.62;if(x<-10||x>W+10)return;
        const y=d.y*(H/BASE_H)+Math.sin(t*.00072+i)*7;
        const amber=worldX>2850&&worldX<5750,color=amber?'224,193,119':'192,221,204';
        if(i%11===0){const glow=ctx.createRadialGradient(x,y,0,x,y,7+d.r*2);glow.addColorStop(0,`rgba(${color},${d.a*.7})`);glow.addColorStop(1,`rgba(${color},0)`);ctx.fillStyle=glow;ctx.fillRect(x-10,y-10,20,20);}
        ctx.fillStyle=`rgba(${color},${d.a})`;ctx.beginPath();ctx.arc(x,y,d.r,0,Math.PI*2);ctx.fill();
      });
    }

    function render(t){
      ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
      const dt=lastTime?Math.min((t-lastTime)/1000,.034):0;lastTime=t;
      updateHunter(dt);
      updateCombat(dt);
      updateMonsters(dt);
      targetCam=clamp(targetCam,0,Math.max(0,WORLD_W-W));
      cam=lerp(cam,targetCam,dragging?.4:.085);

      drawRasterBackdrops();
      // 场景主体统一使用 900px 设计坐标，保证窄屏下地面与建筑仍然贴合。
      ctx.save();ctx.scale(1,H/BASE_H);
      const hasEnvironmentArt=drawEnvironmentPanels(t);
      if(!hasEnvironmentArt){
        drawAncientTree(650,1.05,-1);drawAncientTree(1550,.86,1);drawAncientTree(2580,1.18,-1);
        drawWaterfall(2260,t);drawRuins();drawAncientTree(5580,.96,1);drawNest();
      }
      ctx.restore();
      drawTerrain(t);
      ctx.save();ctx.scale(1,H/BASE_H);drawMudPools(t);const hasPlantArt=drawRasterVegetation();drawWildlife(t);drawMonsters(t);drawTrainingDummy();drawHunter();ctx.restore();
      if(!hasPlantArt)drawPlants(t);drawAtmosphere(t);
      ctx.save();ctx.scale(1,H/BASE_H);drawCombatEffects();ctx.restore();
      drawForeground();
      updateUI();requestAnimationFrame(render);
    }

    function updateUI(){
      const focus=hunter.x, zi=zones.findIndex(z=>focus>=z.x&&focus<z.end), idx=zi<0?zones.length-1:zi;
      if(idx!==lastZone){
        lastZone=idx;const z=zones[idx];ui.name.textContent=z.name;ui.no.textContent=z.no;ui.desc.textContent=z.desc;
        ui.hint.textContent=`前方区域 · ${z.name}`;ui.hint.classList.add('show');clearTimeout(updateUI.timer);updateUI.timer=setTimeout(()=>ui.hint.classList.remove('show'),1300);
      }
      ui.cursor.style.left=`${clamp(focus/WORLD_W*100,0,100)}%`;
      ui.lifeBar.style.transform=`scaleX(${hunter.health/hunter.maxHealth})`;
      ui.staminaBar.style.transform=`scaleX(${hunter.stamina/hunter.maxStamina})`;
      ui.lifeValue.textContent=Math.ceil(hunter.health);
      ui.staminaValue.textContent=Math.ceil(hunter.stamina);
      const actionState=combat.action?combat.action.id==='roll'&&hunter.invulnerable?'翻滚 · 无敌':ACTIONS[combat.action.id].name:null;
      ui.state.textContent=hunter.defeated?'力尽倒下':hunter.hitStun>0?'受击倒地':actionState||combat.sheath?(combat.sheath?`特殊纳刀 · ${combat.sheathTimer.toFixed(1)}s`:actionState):hunter.noDamageTime>=15&&hunter.health<hunter.maxHealth?'生命缓慢恢复':hunter.exhausted?'力竭':hunter.state==='run'?'奔跑':hunter.state==='walk'?'步行':'待机';
      ui.status.classList.toggle('exhausted',hunter.exhausted);
      ui.spiritBar.style.transform=`scaleX(${combat.spirit/combat.maxSpirit})`;
      ui.bladeLevel.textContent=combat.bladeLevel>0?`${bladeNames[combat.bladeLevel]} · ${combat.bladeTimer.toFixed(1)}s`:bladeNames[0];
      ui.spiritShell.classList.remove('level-0','level-1','level-2','level-3');ui.spiritShell.classList.add(`level-${combat.bladeLevel}`);
      const multiplier=bladeMultipliers[combat.bladeLevel]*(combat.spirit>=combat.maxSpirit?1.05:1);
      ui.damageMod.textContent=`伤害 ×${multiplier.toFixed(2)}`;
      const monster=monsters.filter(m=>!m.dead).sort((a,b)=>Math.abs(a.x-focus)-Math.abs(b.x-focus))[0];
      const visibleMonster=monster&&Math.abs(monster.x-focus)<900?monster:null;
      ui.monsterStatus.classList.toggle('active',!!visibleMonster);
      if(visibleMonster){
        ui.monsterName.textContent=visibleMonster.def.name;ui.monsterLifeBar.style.transform=`scaleX(${visibleMonster.health/visibleMonster.def.maxHealth})`;
        ui.monsterState.textContent=visibleMonster.attack?visibleMonster.attack.def.name:visibleMonster.state==='move'?'追踪猎人':'警戒';ui.monsterNote.textContent=visibleMonster.def.note;
      }
    }

    addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();keys.add(k);
      if(['arrowleft','arrowright',' ','j','k','l','control'].includes(k))e.preventDefault();
      if(!e.repeat&&['a','d','arrowleft','arrowright'].includes(k)){
        const side=k==='a'||k==='arrowleft'?'left':'right',now=performance.now();
        if(now-lastDirectionTap[side]<=280){requestRoll(side==='left'?-1:1);lastDirectionTap[side]=-Infinity;}
        else lastDirectionTap[side]=now;
      }
      if(!e.repeat&&['j','k','l','control'].includes(k))handleCombatInput(k);
      if(k==='r'){
        const preserveMonsterHealth=hunter.defeated;
        hunter.x=440;hunter.vx=0;hunter.health=hunter.maxHealth;hunter.stamina=hunter.maxStamina;hunter.exhausted=false;hunter.hitStun=0;hunter.knockV=0;hunter.defeated=false;hunter.noDamageTime=0;
        combat.spirit=0;combat.bladeLevel=0;combat.bladeTimer=0;combat.hitStop=0;combat.action=null;combat.sheath=false;combat.sheathTimer=0;combat.chain=null;combat.chainWindow=0;combat.sheathWindow=0;
        hunter.invulnerable=false;lastDirectionTap.left=-Infinity;lastDirectionTap.right=-Infinity;
        monsters.forEach(monster=>{monster.x=monster.def.home;if(!preserveMonsterHealth){monster.health=monster.def.maxHealth;monster.dead=false;}monster.facing=-1;monster.state=monster.dead?'dead':'idle';monster.attack=null;monster.t=0;monster.cooldown=1.2;monster.flash=0;monster.shake=0;monster.hitDone=false;});mudPools.length=0;
        dummy.health=dummy.maxHealth;damageNumbers.length=0;hitSparks.length=0;impactRings.length=0;impactBursts.length=0;targetCam=0;
      }
      if(k==='h'){
        hudVisible=!hudVisible;document.querySelector('header').hidden=!hudVisible;
        document.querySelector('.chapter').hidden=!hudVisible;document.querySelector('.hud').hidden=!hudVisible;
        document.querySelector('.hunter-status').hidden=!hudVisible;
        document.querySelector('.monster-status').hidden=!hudVisible;
      }
    });
    addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
    canvas.addEventListener('pointerdown',e=>{dragging=true;dragStartX=e.clientX;dragStartCam=targetCam;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});
    canvas.addEventListener('pointermove',e=>{if(dragging)targetCam=clamp(dragStartCam-(e.clientX-dragStartX)*1.45,0,Math.max(0,WORLD_W-W));});
    canvas.addEventListener('pointerup',e=>{dragging=false;canvas.releasePointerCapture(e.pointerId);canvas.classList.remove('dragging');});
    canvas.addEventListener('wheel',e=>{targetCam=clamp(targetCam+e.deltaY*.6+e.deltaX,0,Math.max(0,WORLD_W-W));},{passive:true});

    requestAnimationFrame(render);
  })();
  </script>
</body>
</html>
